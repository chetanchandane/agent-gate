[project]
name = "agent-gate"
version = "0.1.0"
description = "Every change to an LLM agent's behavior must pass a regression gate before it is accepted."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
]

[project.scripts]
agent-gate = "gate.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "gate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "N"]
# N818: the PRD names exceptions (BudgetExceeded, InvalidProposal, ...) without
# an Error suffix. Keep the spec's names.
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "gate"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: tests that call the real Anthropic API (skipped in CI)",
]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["gate"]
