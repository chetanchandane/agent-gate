name: gate

# The live regression gate for pull requests that change policy files.
# Runs agent-gate gate on the PR's candidate policy against the base branch's
# active policy, posts the decision as a PR comment, and fails on a rejection.
# Skipped for forks, which have no access to the API key secret.

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - "policies/**"

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Forks cannot read secrets, so the live gate only runs on same-repo PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      MAX_SPEND_USD: "5"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4

      - name: Check out base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Resolve policy versions
        id: versions
        run: |
          CAND="$(cat policies/ACTIVE)"
          BASE="$(cat base/policies/ACTIVE)"
          echo "candidate=$CAND" >> "$GITHUB_OUTPUT"
          echo "baseline=$BASE" >> "$GITHUB_OUTPUT"
          echo "Candidate policy: $CAND, baseline policy: $BASE"

      - name: Run the gate
        id: gate
        run: |
          set +e
          uv run agent-gate gate \
            --candidate "policies/${{ steps.versions.outputs.candidate }}" \
            --baseline-dir "base/policies/${{ steps.versions.outputs.baseline }}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post decision comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agent-gate-decision -->';
            let body = marker + '\n### agent-gate decision\n';
            try {
              const d = JSON.parse(fs.readFileSync('reports/gate_decision.json', 'utf8'));
              const r = d.rules || {};
              const yn = (p) => (p ? 'pass' : 'FAIL');
              body += `**${d.candidate_id}** vs **${d.parent}**: `;
              body += `**${(d.decision || 'error').toUpperCase()}**\n\n`;
              if (r.R1 && r.R2 && r.R3 && r.R4) {
                body += '| Rule | Result | Values |\n| --- | --- | --- |\n';
                body += `| R1 dev gain | ${yn(r.R1.passed)} | ${r.R1.a.toFixed(2)} to ${r.R1.c.toFixed(2)} |\n`;
                const regressed = (r.R2.regressed_cases || []).map(c => c.id).join(', ') || 'none';
                body += `| R2 safeguard | ${yn(r.R2.passed)} | regressed: ${regressed} |\n`;
                body += `| R3 holdout | ${yn(r.R3.passed)} | ${r.R3.a.toFixed(2)} to ${r.R3.c.toFixed(2)} |\n`;
                body += `| R4 budgets | ${yn(r.R4.passed)} | cost x${r.R4.cost_ratio.toFixed(2)}, p95 x${r.R4.p95_ratio.toFixed(2)} |\n`;
              }
              if ((d.failed_rules || []).length) {
                body += `\nFailed rules: ${d.failed_rules.join(', ')}\n`;
              }
              if ((d.warnings || []).length) {
                body += `\nWarnings: ${d.warnings.join(', ')}\n`;
              }
            } catch (e) {
              body += `\nThe gate did not produce a decision record (exit ${{ steps.gate.outputs.exit_code }}). See the job log.\n`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on rejection or error
        if: steps.gate.outputs.exit_code != '0'
        run: |
          echo "Gate exit code: ${{ steps.gate.outputs.exit_code }}"
          exit 1
