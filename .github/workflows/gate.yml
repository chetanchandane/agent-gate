name: gate

# Runs non-secret repository validation for policy pull requests.
# The live regression gate is intentionally not enabled until the runner and
# gate implementation exist. This job must not expose an API key to PR code.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "policies/**"

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Validate policy repository
        run: uv run agent-gate validate
