name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest --cov -m "not live"

      - name: Validate data files
        run: uv run agent-gate validate
        continue-on-error: true
